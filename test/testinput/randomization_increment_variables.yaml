geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 2
  groups:
  - variables:
    - air_pressure
    - air_pressure_levels_minus_one
    levels: 2
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_pressure
  - air_pressure_levels_minus_one
increment variables:
- air_pressure
background error:
  covariance model: SABER
  saber central block:
    saber block name: ID
  randomization size: 1
output perturbations:
  member pattern: '%MEM%'
  filepath: testdata/_MPI_-_OMP__pert_%MEM%
test:
  reference filename: testref/randomization_increment_variables.ref
