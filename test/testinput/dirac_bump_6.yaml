geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 10
  groups:
  - variables:
    - eastward_wind
    - northward_wind
    levels: 2
  halo: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - eastward_wind
  - northward_wind
background error:
  covariance model: hybrid
  run components recursively: true
  components:
  - covariance:
      covariance model: SABER
      covariance type: ensemble
      adjoint test: true
      square-root test: true
      ensemble:
        members from template:
          template:
            date: 2010-01-01T12:00:00Z
            filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
            state variables:
            - eastward_wind
            - northward_wind
          pattern: '%mem%'
          nmembers: 25
          zero padding: 6
    weight:
      value: 0.5
  - covariance:
      covariance model: ensemble
      members from template:
        template:
          date: 2010-01-01T12:00:00Z
          filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
          state variables:
          - eastward_wind
          - northward_wind
        pattern: '%mem%'
        nmembers: 25
        zero padding: 6
    weight:
      value: 0.5
dirac:
  lon:
  - 0.0
  lat:
  - 0.0
  level:
  - 1
  variable:
  - eastward_wind
output dirac:
  filepath: testdata/dirac_bump_6/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_bump_6.ref
