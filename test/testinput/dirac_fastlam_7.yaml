geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 71
    ny : 53
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 10
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  saber central block:
    saber block name: FastLAM
    calibration:
      multivariate strategy: crossed
      groups:
      - group name: air_horizontal_streamfunction
        variable in model file: air_horizontal_streamfunction
        variables:
        - air_horizontal_streamfunction
      - group name: air_horizontal_velocity_potential
        variable in model file: air_horizontal_velocity_potential
        variables:
        - air_horizontal_velocity_potential
      horizontal length-scale:
      - group: air_horizontal_streamfunction
        profile: [10.0e3, 12.0e3, 14.0e3, 16.0e3, 18.0e3, 20.0e3, 22.0e3, 24.0e3, 26.0e3, 28.0e3]
      - group: air_horizontal_velocity_potential
        profile: [20.0e3, 24.0e3, 28.0e3, 32.0e3, 36.0e3, 40.0e3, 44.0e3, 48.0e3, 52.0e3, 56.0e3]
      vertical length-scale:
      - group: air_horizontal_streamfunction
        profile: [2.0, 2.2, 2.4, 2.6, 2.8, 3.0, 3.2, 3.4, 3.6, 3.8]
      - group: air_horizontal_velocity_potential
        profile: [1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9]
      number of layers: 3
      resolution: 5
      normalization accuracy stride: 3
      data file: testdata/dirac_fastlam_7/_MPI_-_OMP__data
      output model files:
      - parameter: normalized horizontal length-scale
        file:
          filepath: testdata/dirac_fastlam_7/_MPI_-_OMP__normalized_rh
      - parameter: weight
        file:
          filepath: testdata/dirac_fastlam_7/_MPI_-_OMP__weight_%component%
      - parameter: normalization
        file:
          filepath: testdata/dirac_fastlam_7/_MPI_-_OMP__norm_%component%
