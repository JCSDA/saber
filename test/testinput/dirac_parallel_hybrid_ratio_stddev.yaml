geometry: &geom
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 10
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 2
  halo: 1

background:
  states:
  - date: 2010-01-01T12:00:00Z
    state variables: *vars

background error:
  covariance model: SABER
  covariance type: hybrid
  run in parallel: true
  adjoint test: true
  parallel covariance relative cpu weight:
  - 0.6
  - 0.4
  geometry: *geom
  components:
    - weight:
        value: 0.5
      covariance:
        saber central block:
          saber block name: ID
        saber outer blocks:
        - saber block name: StdDev
          read:
            model file:
              filepath: testdata/error_covariance_training_stddev_1/2-1_stddev
    - weight:
        value: 0.5
      covariance:
        saber central block:
          saber block name: ID
        saber outer blocks:
        - saber block name: StdDev
          read:
            model file:
              filepath: testdata/error_covariance_training_stddev_2/2-1_stddev
  saber outer blocks:
  - saber block name: write fields
    save netCDF file: false
    output path: testdata/dirac_parallel_hybrid_ratio_stddev
    multiply fset filename: fields_in_multiply
dirac: &dirac
  lon:
  - 0.0
  lat:
  - 0.0
  level:
  - 1
  variable:
  - air_horizontal_streamfunction

diagnostic points: *dirac

output dirac:
  filepath: testdata/dirac_parallel_hybrid_ratio_stddev/_MPI_-_OMP__dirac_%id%

# The result from this should be the same as dirac_parallel_hybrid_stddev.ref
# as all we are doing is splitting the communicator in a different way
test:
  reference filename: testref/dirac_parallel_hybrid_stddev.ref

