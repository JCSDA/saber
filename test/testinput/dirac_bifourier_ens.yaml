# Dirac test for an ensemble B with a bifourier localization matrix
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - geographical_x_wind
    - geographical_y_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - log_of_air_pressure_at_surface
    levels: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - geographical_x_wind
  - geographical_y_wind
  - air_temperature
  - log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  covariance type: ensemble
  adjoint test: true
  square-root test: true
  square-root tolerance: 1.0e-8
  inverse test: true
  ensemble:
    members from template:
      template:
        date: 2010-01-01T12:00:00Z
        filepath: testdata/randomization_bifourier/_MPI_-_OMP__member_%mem%
        state variables:
        - geographical_x_wind
        - geographical_y_wind
        - air_temperature
        - log_of_air_pressure_at_surface
        - water_vapor_mixing_ratio_wrt_moist_air
      pattern: '%mem%'
      nmembers: 25
      zero padding: 6
  localization:
    saber central block:
      multivariate strategy: duplicated
      groups:
      - group name: allVars
        variables: 
        - geographical_x_wind
        - geographical_y_wind
        - air_temperature
        - log_of_air_pressure_at_surface
        - water_vapor_mixing_ratio_wrt_moist_air
        variables on extra levels:
        - log_of_air_pressure_at_surface
        group central block:
          saber block name: BifourierCovariance
          calibration:
            profiles:
            - variable: allVars
              horizontal length-scales: [30.0e3, 28.0e3, 26.0e3, 24.0e3, 22.0e3, 20.0e3, 18.0e3, 16.0e3, 14.0e3, 12.0e3, 30.0e3]
              vertical length-scale: 4.0
        group outer blocks:
        - saber block name: BifourierSpectralToGrid
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 10
  variable:
  - air_temperature
output dirac:
  filepath: testdata/dirac_bifourier_ens/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_bifourier_ens.ref
