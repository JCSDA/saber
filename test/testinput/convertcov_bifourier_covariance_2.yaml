# Convert covariance operator file from arome format to bifourier block-specific format
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - air_temperature_and_log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  saber central block:
    saber block name: BifourierAromeCovariance
    read:
      input file: testdata/convertcov_bifourier_covariance_1/_MPI_-_OMP__covariance.nc
      input file format: arome legacy netcdf
    write:
      output file: testdata/convertcov_bifourier_covariance_2/_MPI_-_OMP__covariance.bin
      output file format: arome legacy binary
    force write: true
  saber outer blocks:
  - saber block name: BifourierSpectralToGrid
dirac:
  lon:
  - 9.9058
  - 9.9058
  - 9.9058
  - 9.9058
  lat:
  - 56.3223
  - 56.3223
  - 56.3223
  - 56.3223
  level:
  - 1
  - 1
  - 11
  - 1
  variable:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - air_temperature_and_log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/convertcov_bifourier_covariance_2/%MPI%_dirac_%id%
test:
  reference filename: testref/convertcov_bifourier_covariance_2.ref
