geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 10
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 2
  halo: 1
background:
  date: '2010-01-01T12:00:00Z'
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
background error:
  covariance model: SABER
  adjoint test: true
  saber central block:
    saber block name: ID
  saber outer blocks:
  - saber block name: StdDev
    standard deviations:
    - variable: air_horizontal_streamfunction
      scale factor: 2.0
    - variable: air_horizontal_velocity_potential
      scale factor: 0.5
    read:
      atlas file:
        filepath: testdata/error_covariance_training_stddev_1/_MPI_-_OMP__stddev
dirac: &dirac
  lon:
  - 0.0
  - 0.0
  lat:
  - 0.0
  - 0.0
  level:
  - 1
  - 1
  variable:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
diagnostic points: *dirac
output dirac:
  filepath: testdata/dirac_stddev_5/_MPI_-_OMP__stddev_%id%
test:
  reference filename: testref/dirac_stddev_5.ref
