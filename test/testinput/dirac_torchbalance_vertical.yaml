geometry:
  function space: NodeColumns
  grid:
    name: CS-LFR-15
  partitioner: cubedsphere
  halo: 1
  groups:
  - variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    levels: 4

background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - sea_water_potential_temperature
  - sea_water_salinity

background error:
  covariance model: SABER
  adjoint test: true
  saber outer blocks:
  - saber block name: TorchBalance
    surface emulators: []
    vertical emulators:
    - name: sea_water_salinity
      path: ./testdata/dirac_torchbalance/vertical_emulator.ts
      jacobian wrt:
      - sea_water_potential_temperature
  saber central block:
    saber block name: ID

dirac:
  lon:
  - 0.0
  - 0.0
  lat:
  - -4.38894
  - -4.38894
  level:
  - 1
  - 1
  variable:
  - sea_water_potential_temperature
  - sea_water_salinity

output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_torchbalance_vertical/%MPI%_dirac_%id%

test:
  reference filename: testref/dirac_torchbalance_vertical.ref
