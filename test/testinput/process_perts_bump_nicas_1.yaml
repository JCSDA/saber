geometry:
  function space: StructuredColumns
  grid:
    name: S10
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    levels: &levels 10
  halo: 1
background:
  date: &date 2010-01-01T12:00:00Z
  state variables: *vars
bands:
- band:
    filter:
    - saber block name: BUMP_NICASFilter
      read:
        general:
          testing: true
          universe length-scale: 10000.0e3
        io:
          data directory: testdata
          files prefix: process_perts_bump_nicas_1/_MPI_-_OMP_
        drivers:
          multivariate strategy: univariate
          compute nicas: true
          write local nicas: true
        nicas:
          filter mode: true
          filter resolution: 4.0
          explicit length-scales: true
          horizontal length-scale:
          - groups:
            - air_horizontal_streamfunction
            value: 4000.0e3
          vertical length-scale:
          - groups:
            - air_horizontal_streamfunction
            value: 3.0
  output:
    model write:
      filepath: testdata/process_perts_bump_nicas_1/filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- output:
    model write:
      filepath: testdata/process_perts_bump_nicas_1/filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'
recursive filters: true
ensemble pert:
  date: *date
  members from template:
    nmembers: 2
    pattern: '%MEM%'
    template:
      filepath: testdata/randomization_diffusion_2/1-1_member_pert_%MEM%
      variables: *vars
input variables: *vars
test:
  reference filename: testref/process_perts_bump_nicas_1.ref
