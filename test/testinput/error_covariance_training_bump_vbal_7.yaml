geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    nx : 72
    ny : 46
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    levels: 4
    vertical coordinate:
      profile: [-1.0,-5.0,-9.0,-11.0]
  - variables:
    - air_pressure_at_surface
    levels: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
background error:
  covariance model: SABER
  saber central block:
    saber block name: ID
  saber outer blocks:
  - saber block name: BUMP_VerticalBalance
    fields metadata:
      air_horizontal_streamfunction:
        vert_coord: vert_coord_0
      air_horizontal_velocity_potential:
        vert_coord: vert_coord_0
      air_temperature:
        vert_coord: vert_coord_0
      air_pressure_at_surface:
        vert_coord: vert_coord_1
    calibration:
      general:
        testing: true
      io:
        data directory: testdata
        files prefix: error_covariance_training_bump_vbal_7/_MPI_-_OMP_
        gsi data file: gsi-coeffs-gmao-global-l72x72y46
        gsi namelist: dirac_gsi_geos_global.nml
      drivers:
        write local sampling: true
        write global sampling: true
        compute vertical balance: true
        write vertical balance: true
        adjoints test: true
        internal dirac test: true
        interpolate from gsi data: true
      sampling:
        diagnostic grid size: 89
      vertical balance:
        vbal:
        - balanced variable: air_horizontal_velocity_potential
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_temperature
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_pressure_at_surface
          unbalanced variable: air_horizontal_streamfunction
      dirac:
      - longitude: 0.0
        latitude: 0.0
        level: 4
        variable: air_horizontal_streamfunction
      output model files:
      - parameter: dirac_vbal
        file:
          filepath: testdata/error_covariance_training_bump_vbal_7/_MPI_-_OMP__dirac
test:
  reference filename: testref/error_covariance_training_bump_vbal_7.ref
