geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 8
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 2
  halo: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      general:
        testing: true
        universe length-scale: 10000.0e3
      io:
        data directory: testdata
        files prefix: error_covariance_training_bump_nicas_2/_MPI_-_OMP_
        overriding nicas file: error_covariance_training_bump_nicas_1/_MPI_-_OMP__nicas
      drivers:
        multivariate strategy: univariate
        read global nicas: true
        write local nicas: true
        adjoints test: true
        internal dirac test: true
      dirac:
      - longitude: 0.0
        latitude: 0.0
        level: 1
        variable: air_horizontal_streamfunction
      output model files:
      - parameter: dirac_nicas
        file:
          filepath: testdata/error_covariance_training_bump_nicas_2/_MPI_-_OMP__dirac_nicas
      input model files:
      - parameter: rh
        component: 1
        file:
          filepath: testdata/convertstate_rh/_MPI_-_OMP__cor_rh
      output model files:
      - parameter: dirac_nicas
        file:
          filepath: testdata/error_covariance_training_bump_nicas_2/_MPI_-_OMP__dirac_nicas
test:
  reference filename: testref/error_covariance_training_bump_nicas_2.ref
