geometry:
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 10
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: &levels 10
  halo: 1

background:
  states:
  - date: 2010-01-01T12:00:00Z
    state variables: *vars

background error:
  covariance model: SABER
  adjoint test: true
  saber central block:
    saber block name: diffusion
    read:
      groups:
      - variables: *vars
        horizontal:
          filepath: testdata/error_covariance_training_diffusion_2/_MPI_-_OMP__hz
        vertical:
          levels: *levels
          filepath: testdata/error_covariance_training_diffusion_2/_MPI_-_OMP__vt
dirac:
  lon:
  - 0.01
  - 180.01
  lat:
  - 0.01
  - 88.01
  level:
  - 1
  - 1
  variable: [air_horizontal_streamfunction, air_horizontal_velocity_potential]
output dirac:
  filepath: testdata/dirac_diffusion_2/_MPI_-_OMP__dirac_%id%

test:
  reference filename: testref/dirac_diffusion_2.ref
