# Direct calibration of a bifourier covariance matrix using positive subellipses half-width
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 74
    ny : 52
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - geographical_x_wind
    - geographical_y_wind
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - geographical_x_wind
  - geographical_y_wind
  - air_temperature_and_log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  ensemble:
    members from template:
      template:
        date: 2010-01-01T12:00:00Z
        filepath: testdata/randomization_bifourier_covariance/_MPI_-_OMP__member_%mem%
        state variables:
        - geographical_x_wind
        - geographical_y_wind
        - air_temperature_and_log_of_air_pressure_at_surface
        - water_vapor_mixing_ratio_wrt_moist_air
      pattern: '%mem%'
      nmembers: 25
      zero padding: 6
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierCovariance
    calibration: {}
    write:
      output file: testdata/error_covariance_training_bifourier_covariance_2/_MPI_-_OMP__covariance.nc
      write covariance: true
  saber outer blocks:
  - saber block name: BifourierSpectralVorDivToGridWind
    transform:
      sub-ellipses half-width: 1.5
    active variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - geographical_x_wind
    - geographical_y_wind
    - air_temperature_and_log_of_air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    biperiodization:
      x inner extension: 7
      y inner extension: 5
      x outer extension: 7
      y outer extension: 5
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 4
  variable:
  - air_temperature_and_log_of_air_pressure_at_surface
output dirac:
  filepath: testdata/error_covariance_training_bifourier_covariance_2/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/error_covariance_training_bifourier_covariance_2.ref
