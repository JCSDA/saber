background error:
  covariance model: SABER
  adjoint test: true
  saber central block:
    saber block name: gsi static covariance
    read:
      gsi error covariance file: testdata/gsi-coeffs-global-l127x64y32.nc4
      gsi berror namelist file: testdata/dirac_gsi_gfs_global.nml
      gsi akbk: /dev/null
      debugging mode: false
  saber outer blocks:
  - saber block name: interpolation
    inner geometry:
      function space: StructuredColumns
      custom grid matching gsi:
        type: gaussian
        lats: 32
        lons: 64
      custom partitioner matching gsi:
        bands: _MPI_  # matches GSI partition for 1 or 2 MPI tasks, but too simplistic in general
      halo: 1
    forward interpolator:
      local interpolator type: oops unstructured grid interpolator
    inverse interpolator:
      local interpolator type: oops unstructured grid interpolator
    state variables to inverse:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_pressure_at_surface
dirac:
  lon:
  - 0.0
  lat:
  - 2.950423
  level:
  - 1
  variable:
  - air_horizontal_streamfunction
geometry:
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 15
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    levels: 127
  - variables:
    - air_pressure_at_surface
    levels: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_gsi_gfs_global/%MPI%_dirac_%id%
test:
  float relative tolerance: 1.5e-06
  reference filename: testref/dirac_gsi_gfs_global.ref
