# Convert balance operator file from arome format to bifourier block-specific format
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 74
    ny : 52
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - log_of_air_pressure_at_surface
    levels: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - air_temperature
  - log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierID
  saber outer blocks:
  - saber block name: BifourierAromeBalance
    read:
      input file: testdata/convertcov_bifourier_balance_1/_MPI_-_OMP__balance.nc
      input file format: arome legacy netcdf
    write:
      output file: testdata/convertcov_bifourier_balance_2/_MPI_-_OMP__balance.bin
      output file format: arome legacy binary
    force write: true
    rows:
    - output variable: balanced_air_pressure
    - output variable: air_horizontal_divergence
      input variables: [balanced_air_pressure]
    - output variable: air_temperature_and_log_of_air_pressure_at_surface
      input variables: [balanced_air_pressure, air_horizontal_divergence]
    - output variable: water_vapor_mixing_ratio_wrt_moist_air
      input variables: [balanced_air_pressure, air_horizontal_divergence, air_temperature_and_log_of_air_pressure_at_surface]
    active variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - air_temperature
    - log_of_air_pressure_at_surface
    - air_temperature_and_log_of_air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
  - saber block name: BifourierSpectralToGrid
dirac:
  lon:
  - 9.9058
  - 9.9058
  - 9.9058
  - 9.9058
  lat:
  - 56.3223
  - 56.3223
  - 56.3223
  - 56.3223
  level:
  - 1
  - 1
  - 1
  - 1
  variable:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
output dirac:
  filepath: testdata/convertcov_bifourier_balance_2/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/convertcov_bifourier_balance_2.ref
