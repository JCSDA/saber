geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 10
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 2
  halo: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
background error:
  covariance model: SABER
  iterative ensemble loading: true
  ensemble:
    members from template:
      template:
        date: 2010-01-01T12:00:00Z
        filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
        state variables:
        - air_horizontal_streamfunction
        - air_horizontal_velocity_potential
      pattern: '%mem%'
      nmembers: 20
      zero padding: 6
      start: 3
      except:
      - 5
      - 12
      - 18
  saber central block:
    saber block name: ID
  saber outer blocks:
  - saber block name: BUMP_StdDev
    calibration:
      general:
        testing: true
      io:
        data directory: testdata
        files prefix: error_covariance_training_bump_stddev_2/_MPI_-_OMP_
      drivers:
        compute variance: true
      diagnostics:
        target ensemble size: 20
      nicas:
        filter min effective resolution: 1.1
      variance:
        objective filtering: true
        filtering passes: 3
        initial length-scale:
        - variables:
          - air_horizontal_streamfunction
          value: 1000.0e3
        - variables:
          - air_horizontal_velocity_potential
          value: 1200.0e3
      output model files:
      - parameter: stddev
        file:
          filepath: testdata/error_covariance_training_bump_stddev_2/_MPI_-_OMP__stddev
test:
  reference filename: testref/error_covariance_training_bump_stddev_2.ref
