# Dirac test of the BifourierSpectralVorDivToGridWind block, with the outer spherical winds activated mode activated
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - eastward_wind
    - northward_wind
    levels: 10
  - variables:
    - map_factor
    - dxDlon
    - dxDlat
    - dyDlon
    - dyDlat
    levels: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - eastward_wind
  - northward_wind
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierID
  saber outer blocks:
  - saber block name: BifourierSpectralVorDivToGridWind
    outer spherical winds: true
    biperiodization:
      x inner extension: 7
      y inner extension: 5
      x outer extension: 7
      y outer extension: 5
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 1
  variable:
  - eastward_wind
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_bifourier_vordivtouv_3/%MPI%_dirac_%id%
test:
  reference filename: testref/dirac_bifourier_vordivtouv_3.ref
