geometry:
  function space: NodeColumns
  grid:
    name: CS-LFR-14
  partitioner: cubedsphere
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    levels: 70
  halo: 1

background:
  date: &date 2010-01-01T12:00:00Z
  state variables: *vars

bands:
- band:
    gauss to cubed-sphere-dual block: &GaussToCSDual # To avoid a copy in right inverse and direct blocks
      saber block name: gauss to cubed-sphere-dual
      gauss grid uid: F14
    filter:
    - saber block name: write variances
      binning:
        type: horizontal global average
      field names: *vars
      instantaneous statistics:
        multiply fset filename: initial_CS14_variance
        output path: testdata/process_perts_spectralb_from_csdual_states_2/
    - <<: *GaussToCSDual
      right inverse: true
      reuse already created block: true
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 0
        waveband peak: 1
        waveband max: 3
      preserving variance: true
      active variables: *vars
    - saber block name: spectral to gauss
      active variables: *vars
    - saber block name: write variances
      binning:
        type: horizontal global average
      field names: *vars
      instantaneous statistics:
        multiply fset filename: wb1_F14_variance
        output path: testdata/process_perts_spectralb_from_csdual_states_2/
    - saber block name: write fields
      output path: testdata/process_perts_spectralb_from_csdual_states_2/
      multiply fset filename: wb1_F14_inc
    - <<: *GaussToCSDual
  output:
    model write:
      filepath: testdata/process_perts_spectralb_from_csdual_states_2/_MPI_-_OMP__wb1_CS-LFR-14_mb%MEM%_inc
      member pattern: '%MEM%'
- band:
    gauss to cubed-sphere-dual block: &GaussToCSDual # To avoid a copy in right inverse and direct blocks
      saber block name: gauss to cubed-sphere-dual
      gauss grid uid: F14
    filter:
    - <<: *GaussToCSDual
      right inverse: true
      reuse already created block: true
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 1
        waveband peak: 3
        waveband max: 9
      preserving variance: true
      active variables: *vars
    - saber block name: spectral to gauss
      active variables: *vars
    - saber block name: write variances
      binning:
        type: horizontal global average
      field names: *vars
      instantaneous statistics:
        multiply fset filename: wb2_F14_variance
        output path: testdata/process_perts_spectralb_from_csdual_states_2/
    - saber block name: write fields
      output path: testdata/process_perts_spectralb_from_csdual_states_2/
      multiply fset filename: wb2_F14_inc
    - <<: *GaussToCSDual
- band:
    gauss to cubed-sphere-dual block: &GaussToCSDual # To avoid a copy in right inverse and direct blocks
      saber block name: gauss to cubed-sphere-dual
      gauss grid uid: F14
    filter:
    - <<: *GaussToCSDual
      right inverse: true
      reuse already created block: true
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 3
        waveband peak: 9
        waveband max: 23 # last waveband max need to be 2N - 1
      preserving variance: true
      complement filter: true
      active variables: *vars
    - saber block name: spectral to gauss
      active variables: *vars
    - <<: *GaussToCSDual
    use residual from filter: true
  output:
    diagnostic only block:
    - saber block name: write variances
      binning:
        type: horizontal global average
      instantaneous statistics:
        multiply fset filename: wb3_cs14_variance
        output path: testdata/process_perts_spectralb_from_csdual_states_2/
    generic write:
      filepath: testdata/process_perts_spectralb_from_csdual_states_2/_MPI_-_OMP__wb3_%GRID%_mb%MEM%_inc
      member pattern: '%MEM%'
      grid pattern: '%GRID%'

input variables: *vars

ensemble:
  members:
  - date: *date
    filepath: testdata/randomization_csdual_sqrtspectralb/_MPI_-_OMP__randomized_csdual_mb1
    state variables: *vars
  - date: *date
    filepath: testdata/randomization_csdual_sqrtspectralb/_MPI_-_OMP__randomized_csdual_mb2
    state variables: *vars

test:
  float relative tolerance: 5.0e-6       # default value of 1.0e-6
  reference filename: testref/process_perts_spectralb_from_csdual_states_2.ref
