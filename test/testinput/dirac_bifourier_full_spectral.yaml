# Dirac test for a full bifourier covariance matrix
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - reduced_x_wind
    - reduced_y_wind
    - geographical_x_wind
    - geographical_y_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - log_of_air_pressure_at_surface
    levels: 1
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
  latitude south to north: false
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - geographical_x_wind
  - geographical_y_wind
  - air_temperature
  - log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  saber central block:
    saber block name: BifourierCovariance
    read:
      input file: testdata/convertcov_bifourier_covariance/_MPI_-_OMP__covariance.nc
  saber outer blocks:
  - saber block name: BifourierVorToPb
  - saber block name: BifourierBalance
    read:
      input file: testdata/convertcov_bifourier_balance/_MPI_-_OMP__balance.nc
    rows:
    - output variable: air_upward_absolute_vorticity
    - output variable: balanced_air_pressure
    - output variable: air_horizontal_divergence
      input variables: [balanced_air_pressure]
    - output variable: air_temperature_and_log_of_air_pressure_at_surface
      input variables: [balanced_air_pressure, air_horizontal_divergence]
    - output variable: water_vapor_mixing_ratio_wrt_moist_air
      input variables: [balanced_air_pressure, air_horizontal_divergence, air_temperature_and_log_of_air_pressure_at_surface]
  - saber block name: BifourierVorToPb
    backward mode: true
  - saber block name: BifourierSplitTPs
  - saber block name: BifourierVorDivToRedWind
  - saber block name: BifourierSpectralToGrid
  - saber block name: RedWindToGeoWind
    biperiodization: &biper
      x inner extension: 7
      y inner extension: 5
      x outer extension: 7
      y outer extension: 5
  - saber block name: Biperiodization
    biperiodization: *biper
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 1
  variable:
  - air_temperature
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_bifourier_full_spectral/%MPI%_dirac_%id%
test:
  reference filename: testref/dirac_bifourier_full_spectral.ref
