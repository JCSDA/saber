geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    nx : 72
    ny : 46
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    levels: 4
    vertical coordinate:
      profile: [-1.0,-5.0,-9.0,-11.0]
  - variables:
    - air_pressure_at_surface
    levels: 1
  io:
    latitude south to north: false
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  saber central block:
    saber block name: BUMP_NICAS
    fields metadata:
      air_horizontal_streamfunction:
        vert_coord: vert_coord_0
      air_horizontal_velocity_potential:
        vert_coord: vert_coord_0
      air_temperature:
        vert_coord: vert_coord_0
      air_pressure_at_surface:
        vert_coord: vert_coord_1
    read:
      general:
        testing: true
      io:
        data directory: testdata
        files prefix: dirac_bump_7/_MPI_-_OMP_
        overriding nicas file: error_covariance_training_bump_hdiag-nicas_4/_MPI_-_OMP__nicas
      drivers:
        multivariate strategy: univariate
        read local nicas: true
      grids:
      - model:
          variables:
          - air_horizontal_streamfunction
          - air_horizontal_velocity_potential
          - air_temperature
      - model:
          variables:
          - air_pressure_at_surface
  saber outer blocks:
  - saber block name: StdDev
    fields metadata:
      air_horizontal_streamfunction:
        vert_coord: vert_coord_0
      air_horizontal_velocity_potential:
        vert_coord: vert_coord_0
      air_temperature:
        vert_coord: vert_coord_0
      air_pressure_at_surface:
        vert_coord: vert_coord_1
    read:
      model file:
        filepath: testdata/error_covariance_training_bump_stddev_6/_MPI_-_OMP__stddev
  - saber block name: BUMP_VerticalBalance
    fields metadata:
      air_horizontal_streamfunction:
        vert_coord: vert_coord_0
      air_horizontal_velocity_potential:
        vert_coord: vert_coord_0
      air_temperature:
        vert_coord: vert_coord_0
      air_pressure_at_surface:
        vert_coord: vert_coord_1
    read:
      general:
        testing: true
      io:
        data directory: testdata
        files prefix: dirac_bump_7/_MPI_-_OMP_
        overriding sampling file: error_covariance_training_bump_vbal_7/_MPI_-_OMP__sampling
        overriding vertical balance file: error_covariance_training_bump_vbal_7/_MPI_-_OMP__vbal
      drivers:
        read local sampling: true
        read vertical balance: true
      vertical balance:
        vbal:
        - balanced variable: air_horizontal_velocity_potential
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_temperature
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_pressure_at_surface
          unbalanced variable: air_horizontal_streamfunction
dirac:
  lon:
  - 0.0
  lat:
  - 2.0
  level:
  - 4
  variable:
  - air_horizontal_streamfunction
output dirac:
  filepath: testdata/dirac_bump_7/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_bump_7.ref
