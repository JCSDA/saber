# Dirac test for a full bifourier covariance matrix, using ECTRANS backend
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 74
    ny : 52
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - geographical_x_wind
    - geographical_y_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - log_of_air_pressure_at_surface
    levels: 1
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - geographical_x_wind
  - geographical_y_wind
  - air_temperature
  - log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierAromeCovariance
    read:
      input file: testdata/bifourier_covariance.nc
  saber outer blocks:
  - saber block name: BifourierAromeBalance
    read:
      input file: testdata/bifourier_balance.nc
    rows:
    - output variable: air_upward_absolute_vorticity
    - output variable: balanced_air_pressure
    - output variable: air_horizontal_divergence
      input variables: [balanced_air_pressure]
    - output variable: air_temperature_and_log_of_air_pressure_at_surface
      input variables: [balanced_air_pressure, air_horizontal_divergence]
    - output variable: water_vapor_mixing_ratio_wrt_moist_air
      input variables: [balanced_air_pressure, air_horizontal_divergence, air_temperature_and_log_of_air_pressure_at_surface]
    balanced air pressure parameters from grid: true
    active variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - air_temperature
    - log_of_air_pressure_at_surface
    - air_temperature_and_log_of_air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
  - saber block name: BifourierSpectralVorDivToGridWind
    transform:
      fft backend: ectrans
    active variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - geographical_x_wind
    - geographical_y_wind
    - air_temperature
    - log_of_air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
  - saber block name: Biperiodization
    biperiodization:
      x inner extension: 7
      y inner extension: 5
      x outer extension: 7
      y outer extension: 5
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 4
  variable:
  - air_temperature
output dirac:
  filepath: testdata/dirac_bifourier_ectrans/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_bifourier_ectrans.ref
