geometry:
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 12
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - eastward_wind
    - northward_wind
    levels: 70
  partitioner: ectrans
  halo: 1

background:
  date: &date 2010-01-01T12:00:00Z
  state variables: &winds
  - eastward_wind
  - northward_wind

bands:
- band:
    filter:
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 0
        waveband peak: 1
        waveband max: 3
      preserving variance: true
      active variables:
      - air_horizontal_streamfunction
      - air_horizontal_velocity_potential
    - saber block name: spectral to gauss
      active variables: *vars
    - saber block name: write fields
      output path: testdata/process_perts_spectralb_from_gauss_perts_5/
      multiply fset filename: wb1_F12_inc
  output:
    model write:
      filepath: testdata/process_perts_spectralb_from_gauss_perts_5/_MPI_-_OMP__filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- band:
    filter:
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 1
        waveband peak: 3
        waveband max: 9
      preserving variance: true
      active variables:
      - air_horizontal_streamfunction
      - air_horizontal_velocity_potential
    - saber block name: spectral to gauss
      active variables: *vars
    - saber block name: write fields
      output path: testdata/process_perts_spectralb_from_gauss_perts_5/
      multiply fset filename: wb2_F12_inc
  output:
    model write:
      filepath: testdata/process_perts_spectralb_from_gauss_perts_5/_MPI_-_OMP__filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'
- band:
    filter:
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        shape: waveband filter
        waveband min: 3
        waveband peak: 9
        waveband max: 23 # last waveband max need to be 2N - 1
      preserving variance: true
      complement filter: true
      active variables:
      - air_horizontal_streamfunction
      - air_horizontal_velocity_potential
    - saber block name: spectral to gauss
      active variables: *vars
#    use residual from filter: true # was not at the correct indentation in develop
  output:
    diagnostic only block:
    - saber block name: write fields
      output path: testdata/process_perts_spectralb_from_gauss_perts_5/
      multiply fset filename: wb3_F12_inc
    model write:
      filepath: testdata/process_perts_spectralb_from_gauss_perts_5/_MPI_-_OMP__filtered_pert_mb%MEM%_wb3
      member pattern: '%MEM%'

ensemble pert:
  date: *date
  members from template:
    nmembers: 2
    pattern: '%MEM%'
    template:
      filepath: testdata/randomization_sqrtspectralb_5/_MPI_-_OMP__randomized_gauss_mb%MEM%
      variables: *winds

input variables: *winds

test:
  reference filename: testref/process_perts_spectralb_from_gauss_perts_5.ref
