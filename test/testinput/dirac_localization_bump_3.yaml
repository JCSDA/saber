            - eastward_wind
            - northward_wind
            saber central block:
              saber block name: BUMP_NICAS
              read:
                general:
                  testing: true
                  universe length-scale: 10000.0e3
                io:
                  data directory: testdata
                  files prefix: dirac_localization_bump_3/_MPI_-_OMP_
                drivers:
                  multivariate strategy: univariate
                  read local nicas: true
          - group name: group2
            variables:
            - air_pressure_at_surface
            - air_horizontal_streamfunction
            saber central block:
              saber block name: BUMP_NICAS
              read:
                general:
                  testing: true
                  universe length-scale: 10000.0e3
                io:
                  data directory: testdata
                  files prefix: dirac_localization_bump_3/_MPI_-_OMP_
                drivers:
                  multivariate strategy: univariate
                  read local nicas: true
    weight:
      value: 0.25
dirac:
  lon:
  - 0.0
  lat:
  - 0.0
  level:
  - 1
  variable:
  - eastward_wind
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_localization_bump_3/%MPI%_dirac_%id%
test:
  reference filename: testref/dirac_localization_bump_3.ref
