geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 10
  groups:
  - variables:
    - eastward_wind
    - northward_wind
    - air_horizontal_streamfunction
    levels: 2
  - variables:
    - air_pressure_at_surface
    levels: 1
  halo: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - eastward_wind
  - northward_wind
  - air_pressure_at_surface
  - air_horizontal_streamfunction
background error:
  covariance model: hybrid
  run components recursively: true
  components:
  - covariance:
      covariance model: ensemble
      members from template:
        template:
          date: 2010-01-01T12:00:00Z
          filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
          state variables:
          - eastward_wind
          - northward_wind
          - air_pressure_at_surface
          - air_horizontal_streamfunction
        pattern: '%mem%'
        nmembers: 25
        zero padding: 6
      localization:
        localization method: SABER
        saber central block:
          saber block name: BUMP_NICAS
          read:
            general:
              testing: true
              universe length-scale: 10000.0e3
            io:
              data directory: testdata
              files prefix: dirac_localization_bump_3/_MPI_-_OMP_
            model:
              groups:
              - group name: group1
                variables:
                - eastward_wind
                - northward_wind
              - group name: group2
                variables:
                - air_pressure_at_surface
                - air_horizontal_streamfunction
            drivers:
              multivariate strategy: crossed
              compute nicas: true
              write local nicas: true
            ensemble sizes:
              total ensemble size: 25
            nicas:
              resolution: 4.0
              explicit length-scales: true
              horizontal length-scale:
              - groups:
                - group1
                value: 6000.0e3
              - groups:
                - group2
                value: 4000.0e3
              vertical length-scale:
              - groups:
                - group1
                value: 3.0
              - groups:
                - group2
                value: 2.5
    weight:
      value: 0.25
  - covariance:
      covariance model: ensemble
      members from template:
        template:
          date: 2010-01-01T12:00:00Z
          filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
          state variables:
          - eastward_wind
          - northward_wind
          - air_pressure_at_surface
          - air_horizontal_streamfunction
        pattern: '%mem%'
        nmembers: 25
        zero padding: 6
      localization:
        localization method: SABER
        saber central block:
          multivariate strategy: crossed
          groups:
          - group name: group1
            variables:
            - eastward_wind
            - northward_wind
            saber central block:
              saber block name: BUMP_NICAS
              read:
                general:
                  testing: true
                  universe length-scale: 10000.0e3
                io:
                  data directory: testdata
                  files prefix: dirac_localization_bump_3/_MPI_-_OMP_
                drivers:
                  multivariate strategy: univariate
                  read local nicas: true
          - group name: group2
            variables:
            - air_pressure_at_surface
            - air_horizontal_streamfunction
            saber central block:
              saber block name: BUMP_NICAS
              read:
                general:
                  testing: true
                  universe length-scale: 10000.0e3
                io:
                  data directory: testdata
                  files prefix: dirac_localization_bump_3/_MPI_-_OMP_
                drivers:
                  multivariate strategy: univariate
                  read local nicas: true
    weight:
      value: 0.25
  - covariance:
      covariance model: SABER
      covariance type: ensemble
      adjoint test: true
      square-root test: true
      square-root tolerance: 1.0e-10
      ensemble:
        members from template:
          template:
            date: 2010-01-01T12:00:00Z
            filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
            state variables:
            - eastward_wind
            - northward_wind
            - air_pressure_at_surface
            - air_horizontal_streamfunction
          pattern: '%mem%'
          nmembers: 25
          zero padding: 6
      localization:
        saber central block:
          saber block name: BUMP_NICAS
          read:
            general:
              testing: true
              universe length-scale: 10000.0e3
            io:
              data directory: testdata
              files prefix: dirac_localization_bump_3/_MPI_-_OMP_
            drivers:
              multivariate strategy: crossed
              read local nicas: true
            model:
              groups:
              - group name: group1
                variables:
                - eastward_wind
                - northward_wind
              - group name: group2
                variables:
                - air_pressure_at_surface
                - air_horizontal_streamfunction
    weight:
      value: 0.25
  - covariance:
      covariance model: SABER
      covariance type: ensemble
      adjoint test: true
      square-root test: true
      square-root tolerance: 1.0e-10
      ensemble:
        members from template:
          template:
            date: 2010-01-01T12:00:00Z
            filepath: testdata/randomization_bump_nicas_L10L2/_MPI_-_OMP__member_%mem%
            state variables:
            - eastward_wind
