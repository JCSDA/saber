# Same as dirac_bifourier_covariance_1, with an additional biperiodization block
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 68
    ny : 48
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_upward_absolute_vorticity
    - air_horizontal_divergence
    - water_vapor_mixing_ratio_wrt_moist_air
    levels: 10
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - air_temperature_and_log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierCovariance
    read:
      input file: testdata/bifourier_covariance.nc
  saber outer blocks:
  - saber block name: BifourierSpectralToGrid
  - saber block name: Biperiodization
    biperiodization:
      x inner extension: 12
      y inner extension: 8
      x outer extension: 6
      y outer extension: 4
    skip tests: true
dirac:
  lon:
  - 9.9058
  - 9.9058
  - 9.9058
  - 9.9058
  lat:
  - 56.3223
  - 56.3223
  - 56.3223
  - 56.3223
  level:
  - 1
  - 1
  - 11
  - 1
  variable:
  - air_upward_absolute_vorticity
  - air_horizontal_divergence
  - air_temperature_and_log_of_air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
output dirac:
  filepath: testdata/dirac_bifourier_covariance_3/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_bifourier_covariance_3.ref
