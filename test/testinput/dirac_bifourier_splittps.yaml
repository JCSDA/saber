# Dirac test for the BifourierSplitTPs block, forward and backward
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_temperature
    levels: 10
  - variables:
    - log_of_air_pressure_at_surface
    levels: 1
  - variables:
    - air_temperature_and_log_of_air_pressure_at_surface
    levels: 11
  latitude south to north: false
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_temperature
  - log_of_air_pressure_at_surface
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierID
  saber outer blocks:
  - saber block name: BifourierSplitTPs
    backward mode: true
  - saber block name: BifourierSplitTPs
  - saber block name: BifourierSpectralToGrid
dirac:
  lon:
  - 9.9058
  lat:
  - 56.3223
  level:
  - 1
  variable:
  - log_of_air_pressure_at_surface
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/dirac_bifourier_splittps/%MPI%_dirac_%id%
test:
  reference filename: testref/dirac_bifourier_splittps.ref
