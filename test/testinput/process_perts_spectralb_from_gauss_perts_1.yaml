geometry:
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 12
  groups:
  - variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - eastward_wind
    - mu
    - northward_wind 
    - unbalanced_pressure_levels_minus_one 
    levels: 70
  partitioner: ectrans
  halo: 1

background:
  date: &date 2010-01-01T12:00:00Z
  state variables: &vars
  - eastward_wind
  - mu
  - northward_wind
  - unbalanced_pressure_levels_minus_one

bands:
- band:
    filter:
    - saber block name: spectral to gauss
      right inverse: true
      reuse already created block: true
    - saber block name: spectral analytical filter
      function:
        horizontal daley length: 5008e3
      active variables:
      - air_horizontal_streamfunction
      - air_horizontal_velocity_potential
      - mu
      - unbalanced_pressure_levels_minus_one   
    - saber block name: spectral to gauss
      active variables:
      - air_horizontal_streamfunction
      - air_horizontal_velocity_potential
      - eastward_wind
      - mu
      - northward_wind
      - unbalanced_pressure_levels_minus_one
- output:
    generic write:
      filepath: testdata/process_perts_spectralb_from_gauss_perts_1/_MPI_-_OMP__filtered_pert_grid_%GRID%_mb%MEM%_wb2
      member pattern: '%MEM%'
      grid pattern: '%GRID%'
    model write:
      filepath: testdata/process_perts_spectralb_from_gauss_perts_1/_MPI_-_OMP__filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'

recursive filters: true

ensemble pert:
  date: *date
  members from template:
    nmembers: 2
    pattern: '%MEM%'
    template:
      filepath: testdata/randomization_sqrtspectralb_1/_MPI_-_OMP__randomized_gauss_mb%MEM%
      variables: *vars

input variables: *vars

test:
  reference filename: testref/process_perts_spectralb_from_gauss_perts_1.ref
