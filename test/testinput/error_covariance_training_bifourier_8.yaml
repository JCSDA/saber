# Calibration of the covariance block with user-specified values
geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 73
    ny : 51
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_temperature
    levels: 10
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_temperature
background error:
  covariance model: SABER
  adjoint test: true
  square-root test: true
  inverse test: true
  saber central block:
    saber block name: BifourierCovariance
    calibration:
      profiles:
      - variable: air_temperature
        horizontal length-scales: [30.0e3, 28.0e3, 26.0e3, 24.0e3, 22.0e3, 20.0e3, 18.0e3, 16.0e3, 14.0e3, 12.0e3]
        vertical length-scale: 4.0
    write:
      output file: testdata/error_covariance_training_bifourier_6/_MPI_-_OMP__covariance.nc
      write covariance: true
  saber outer blocks:
  - saber block name: BifourierSpectralToGrid
dirac:
  lon:
  - 9.9058
  - 9.9058
  lat:
  - 56.3223
  - 56.3223
  level:
  - 1
  - 10
  variable:
  - air_temperature
  - air_temperature
output dirac:
  mpi pattern: '%MPI%'
  filepath: testdata/error_covariance_training_bifourier_8/%MPI%_dirac_%id%
test:
  reference filename: testref/error_covariance_training_bifourier_8.ref
