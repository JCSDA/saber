geometry:
  function space: StructuredColumns
  grid:
    name: S10
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    levels: &levels 10
  halo: 1

background:
  date: &date 2010-01-01T12:00:00Z
  state variables: *vars

bands:
- band:
    filter:
    - saber block name: diffusion filter
      read:
        groups:
        - variables: *vars
          horizontal:
            filepath: testdata/error_covariance_training_diffusion_3/hz-1-1
          vertical:
            levels: *levels
            filepath: testdata/error_covariance_training_diffusion_3/vt-1-1
  output:
    model write:
      filepath: testdata/process_perts_diffusion_1/filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- output:
    model write:
      filepath: testdata/process_perts_diffusion_1/filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'

recursive filters: true

ensemble pert:
  date: *date
  members from template:
    nmembers: 2
    pattern: '%MEM%'
    template:
      filepath: testdata/randomization_diffusion_2/1-1_member_pert_%MEM%
      variables: *vars

input variables: *vars

test:
  reference filename: testref/process_perts_diffusion_1.ref
