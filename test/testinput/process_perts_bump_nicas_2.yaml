geometry:
  function space: StructuredColumns
  grid:
    name: S10
  groups:
  - variables: &vars
    - air_horizontal_streamfunction
    levels: &levels 10
  halo: 1
background:
  date: &date 2010-01-01T12:00:00Z
  state variables: *vars
bands:
- band:
    filter:
      saber central block:
        saber block name: BUMP_NICAS
        read:
          general:
            testing: true
            universe length-scale: 10000.0e3
          io:
            data directory: testdata
            files prefix: process_perts_bump_nicas_2/_MPI_-_OMP_
            overriding nicas file: process_perts_bump_nicas_1/_MPI_-_OMP__nicas
          drivers:
            multivariate strategy: univariate
            read local nicas: true
  output:
    model write:
      filepath: testdata/process_perts_bump_nicas_2/filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- band:
    residual increment from previous bands: true
  output:
    model write:
      filepath: testdata/process_perts_bump_nicas_2/filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'
ensemble pert:
  date: *date
  members from template:
    nmembers: 2
    pattern: '%MEM%'
    template:
      filepath: testdata/randomization_diffusion_2/1-1_member_pert_%MEM%
      variables: *vars
input variables: *vars
test:
  reference filename: testref/process_perts_bump_nicas_2.ref
